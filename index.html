    <script src="Build/UnityLoader.js"></script>

    <script>
        let max = 0;
        let done = 0;
        let totalDownloaded = 0;
        let totalExpected = 0;
        let loadingFinished = false;

        const activeDownloads = new Map();

        function formatBytes(bytes) {
            if (!Number.isFinite(bytes) || bytes < 0) {
                return "Calculating...";
            }

            if (bytes < 1024 * 1024) {
                return (bytes / 1024).toFixed(1) + " KB";
            }

            return (bytes / (1024 * 1024)).toFixed(2) + " MB";
        }

        function updateProgress() {
            if (loadingFinished) return;

            let downloaded = totalDownloaded;
            let expected = totalExpected;

            for (const item of activeDownloads.values()) {
                downloaded += item.loaded;
                expected += item.total;
            }

            let percent = expected > 0
                ? Math.floor((downloaded / expected) * 100)
                : Math.floor((done / Math.max(max, 1)) * 100);

            percent = Math.max(0, Math.min(99, percent));

            document.getElementById("progress-bar").style.width =
                percent + "%";

            document.getElementById("percentage").textContent =
                percent + "%";

            document.getElementById("download-size").textContent =
                expected > 0
                    ? formatBytes(downloaded) + " / " + formatBytes(expected)
                    : formatBytes(downloaded) + " downloaded";
        }

        function mergeFiles(fileParts, label) {
            return new Promise((resolve, reject) => {
                const buffers = [];
                let index = 0;

                function fetchPart() {
                    if (index >= fileParts.length) {
                        resolve(URL.createObjectURL(new Blob(buffers)));
                        return;
                    }

                    const url = fileParts[index++];
                    const filename = url.split("/").pop();

                    document.getElementById("loading-text").textContent =
                        "Downloading " + label;

                    document.getElementById("file-name").textContent =
                        filename;

                    const progress = {
                        loaded: 0,
                        total: 0
                    };

                    activeDownloads.set(url, progress);

                    const request = new XMLHttpRequest();
                    request.open("GET", url);
                    request.responseType = "arraybuffer";

                    request.addEventListener("progress", event => {
                        progress.loaded = event.loaded;
                        progress.total = event.lengthComputable
                            ? event.total
                            : 0;

                        updateProgress();
                    });

                    request.onload = () => {
                        if (request.status < 200 || request.status >= 300) {
                            activeDownloads.delete(url);
                            reject(new Error(
                                "Failed to download " + filename +
                                " (HTTP " + request.status + ")"
                            ));
                            return;
                        }

                        const data = request.response;
                        buffers.push(data);

                        totalDownloaded += data.byteLength;

                        if (progress.total > 0) {
                            totalExpected += progress.total;
                        }

                        activeDownloads.delete(url);
                        done++;

                        document.getElementById("file-name").textContent =
                            filename + " — downloaded";

                        updateProgress();
                        fetchPart();
                    };

                    request.onerror = () => {
                        activeDownloads.delete(url);
                        reject(new Error("Network error: " + filename));
                    };

                    request.send();
                }

                fetchPart();
            });
        }

        UnityLoader.downloadJob = function(e, t) {
            const request = new XMLHttpRequest();
            const url = t.parameters.url;

            if (url.startsWith("Build/blob")) {
                request.open("GET", url.replace("Build/", ""));
            } else {
                request.open("GET", url);
            }

            request.responseType = "arraybuffer";

            request.addEventListener("progress", event => {
                document.getElementById("loading-text").textContent =
                    "Loading game engine";

                document.getElementById("file-name").textContent =
                    url.split("/").pop();

                if (event.lengthComputable) {
                    document.getElementById("download-size").textContent =
                        formatBytes(event.loaded) + " / " +
                        formatBytes(event.total);

                    document.getElementById("progress-bar").style.width =
                        Math.min(99, (event.loaded / event.total) * 100) + "%";

                    document.getElementById("percentage").textContent =
                        Math.floor((event.loaded / event.total) * 100) + "%";
                }

                if (t.parameters.onprogress) {
                    t.parameters.onprogress(event);
                }
            });

            request.onload = function() {
                if (request.status < 200 || request.status >= 300) {
                    document.getElementById("loading-text").textContent =
                        "Download failed";

                    document.getElementById("file-name").textContent =
                        "Refresh the page to try again.";

                    return;
                }

                UnityLoader.Compression.decompress(
                    new Uint8Array(request.response),
                    function(result) {
                        t.complete(result);
                    }
                );
            };

            request.onerror = function() {
                document.getElementById("loading-text").textContent =
                    "Connection error";

                document.getElementById("file-name").textContent =
                    "Check your connection and refresh.";
            };

            if (t.parameters.onprogress) {
                // Progress listener is registered above.
            }

            if (t.parameters.onload) {
                request.addEventListener("load", t.parameters.onload);
            }

            request.send();
        };

        function getParts(file, start, end) {
            const parts = [];

            for (let i = start; i <= end; i++) {
                parts.push(file + ".part" + i);
                max++;
            }

            return parts;
        }

        function resizeUnityContainer() {
            const container = document.getElementById("unityContainer");
            container.style.width = window.innerWidth + "px";
            container.style.height = window.innerHeight + "px";
        }

        function showLoadingError(error) {
            console.error(error);

            document.getElementById("loading-text").textContent =
                "Download failed";

            document.getElementById("file-name").textContent =
                error.message || "Please refresh to try again.";

            document.getElementById("percentage").textContent = "ERROR";
        }

        Promise.all([
            mergeFiles(
                getParts("Build/Raft-WEBGL.data.unityweb", 1, 3),
                "game data"
            ),
            mergeFiles(
                getParts("Build/Raft-WEBGL.asm.code.unityweb", 1, 2),
                "game engine"
            )
        ]).then(([dataUrl, asmCode]) => {
            window.dataUrll = dataUrl;
            window.asmUrll = asmCode;

            document.getElementById("loading-text").textContent =
                "Starting Raft";

            document.getElementById("file-name").textContent =
                "Initializing Unity WebGL";

            const json = {
                "TOTAL_MEMORY": 268435456,
                "dataUrl": dataUrl,
                "asmCodeUrl": asmCode,
                "asmMemoryUrl": "Raft-WEBGL.asm.memory.unityweb",
                "asmFrameworkUrl": "Raft-WEBGL.asm.framework.unityweb",
                "splashScreenStyle": "Dark",
                "backgroundColor": "#000000"
            };

            const blob = new Blob(
                [JSON.stringify(json)],
                { type: "application/json" }
            );

            const blobUrl = URL.createObjectURL(blob);

            window.addEventListener("resize", resizeUnityContainer);

            UnityLoader.instantiate("unityContainer", json, {
                url: blobUrl,
                Module: {
                    onRuntimeInitialized: function() {
                        loadingFinished = true;
                        resizeUnityContainer();

                        document.getElementById("progress-bar").style.width =
                            "100%";

                        document.getElementById("percentage").textContent =
                            "100%";

                        document.getElementById("loading-text").textContent =
                            "Ready";

                        document.getElementById("file-name").textContent =
                            "Entering the world";

                        setTimeout(() => {
                            document.getElementById("loading-screen")
                                .classList.add("finished");
                        }, 400);
                    }
                }
            });
        }).catch(showLoadingError);
    </script>
